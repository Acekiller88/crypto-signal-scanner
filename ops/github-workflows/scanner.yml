name: scanner

# The 15-minute scheduler.
#
# IMPORTANT — read before trusting the cadence:
# GitHub's `schedule` event is best-effort. It is queued like any other Actions
# job and is documented as "delayed during periods of high load"; community
# reports describe */15 jobs firing once an hour or worse during busy periods,
# and a skipped fire is NEVER retried (the next one simply runs when it can).
# The engine therefore records `scheduledAt` vs `executedAt` and the dashboard
# derives freshness from wall-clock age instead of trusting this cron. If you
# need a punctual cadence, drive `workflow_dispatch` from an external scheduler
# (cron-job.org and friends hit a different queue and start within seconds).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scanner/**"
      - "config/**"
      - ".github/workflows/scanner.yml"

# Never let two scans write data/ at the same time. A scheduled run that
# overlaps a manual run would otherwise race on the JSON files and push.
concurrency:
  group: scanner-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The engine is stdlib-only; there is deliberately nothing to install.
      - name: Show engine version
        run: python -c "import scanner; print('engine', scanner.__version__)"

      - name: Run scan
        id: scan
        run: python -m scanner.main
        continue-on-error: true

      - name: Validate published JSON
        run: python -m scanner.validate_data

      - name: Commit data if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data frontend/data frontend/dashboard-offline.html frontend/preview.html
          if git diff --cached --quiet; then
            echo "No data changes -- skipping commit"
            exit 0
          fi
          git commit -m "chore(data): scan $(date -u +'%Y-%m-%dT%H:%MZ')"
          # A concurrent run may have pushed while we were scanning.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          exit 1

      # The scan step is allowed to fail softly so that a degraded/failed scan
      # still publishes its status JSON (that is the whole failure policy), but
      # the job itself must surface the failure.
      - name: Propagate scan failure
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::scan exited non-zero -- see the Run scan step"
          exit 1
