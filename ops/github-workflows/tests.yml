name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install QA tooling
        run: pip install -r requirements.txt

      - name: Unit + integration tests
        run: python -m pytest tests/ -q

      - name: Byte-compile the engine
        run: python -m compileall -q scanner tests

      - name: Validate committed JSON
        run: python -m scanner.validate_data

      # Guards the specific regressions found in the v1.2 audit: the docs must
      # not claim a test count that does not exist, and the badge must point at
      # the file the engine actually writes.
      - name: Documentation consistency
        run: python -m scanner.check_docs
